<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Blog{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
    <script>
        (function () {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'post_list' %}">My Blog</a>
            <div class="d-flex align-items-center gap-2">
                <button type="button" class="theme-toggle" id="themeToggle" title="Toggle dark mode">🌙</button>
                {% if user.is_authenticated %}
                    <a class="btn btn-outline-light me-2" href="{% url 'post_create' %}">New Post</a>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light">Logout ({{ user.username }})</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-light me-2" href="{% url 'login' %}">Login</a>
                    <a class="btn btn-outline-light" href="{% url 'signup' %}">Sign up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const root = document.documentElement;

        function updateIcon() {
            themeToggle.textContent = root.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
        }
        updateIcon();

                themeToggle.addEventListener('click', function () {
            if (root.getAttribute('data-theme') === 'dark') {
                root.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                root.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
            updateIcon();
        });

        // Add a show/hide toggle to every password field on the page
        document.querySelectorAll('input[type="password"]').forEach(function (input) {
            const wrapper = document.createElement('div');
            wrapper.className = 'password-wrapper';
            input.parentNode.insertBefore(wrapper, input);
            wrapper.appendChild(input);

            const toggleBtn = document.createElement('button');
            toggleBtn.type = 'button';
            toggleBtn.className = 'password-toggle-btn';
            toggleBtn.textContent = '👁️';
            toggleBtn.setAttribute('aria-label', 'Show password');
            wrapper.appendChild(toggleBtn);

            toggleBtn.addEventListener('click', function () {
                if (input.type === 'password') {
                    input.type = 'text';
                    toggleBtn.textContent = '🙈';
                    toggleBtn.setAttribute('aria-label', 'Hide password');
                } else {
                    input.type = 'password';
                    toggleBtn.textContent = '👁️';
                    toggleBtn.setAttribute('aria-label', 'Show password');
                }
            });
        });
    </script>
</body>
</html>
